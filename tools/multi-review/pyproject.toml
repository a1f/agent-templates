[project]
name = "multi-review"
version = "0.1.0"
description = "Multi-model code review tool that calls multiple AI CLIs and merges findings"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "structlog>=24.0",
    "rich>=13.0",
]

[project.scripts]
multi-review = "multi_review.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_review"]

[tool.ruff]
target-version = "py312"
src = ["src"]
select = ["E", "F", "I", "B", "C4", "UP", "SIM", "PIE", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]
