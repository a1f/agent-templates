# --- packages (provisional curation; mirrors issue #74's examples) ---
# extras = source-relative paths (files or dirs) to the runtime support files a
# skill reads — schemas, gates, helper scripts — staged with the units so an
# install is self-contained.
[[packages]]
name = "architect-pr"
units = [
  "skill/make-pr",
  "agent/tdd-runner",
  "agent/worker-coder",
  "agent/reviewer",
  "agent/critic",
  "rule/design-principles",
  "rule/tdd",
]
extras = ["schemas", "gates", "scripts/validate_return.py", "rules"]

[[packages]]
name = "lite-pr"
units = [
  "skill/make-pr-lite",
  "agent/coder-lite",
  "agent/reviewer",
  "agent/critic",
  "rule/design-principles",
  "rule/tdd",
]
extras = ["schemas", "gates", "scripts/validate_return.py", "rules"]

# improve-architecture audits a subsystem; its rubric is the canonical design-principles
# rule, composed in via the rules extra rather than a bundled in-skill copy.
[[packages]]
name = "improve-architecture"
units = ["skill/improve-architecture", "rule/design-principles"]
extras = ["rules"]

[[packages]]
name = "breakdown"
units = [
  "skill/breakdown",
  "skill/to-prd",
  "skill/to-issues",
  "skill/pr-breakdown",
  "skill/course-correct",
]

# pr-breakdown publishes a PR-map artifact from the issue's PR table; its page skeleton
# ships as a package extra so an install is self-contained. A dedicated single-skill
# package carries the extra (like pr-explain) so the multi-skill breakdown package above
# stays extra-free; the skill degrades to inline HTML (same chip/edge contract) when
# installed without it. The planning bundle pulls this in so the flagship path ships it.
[[packages]]
name = "pr-breakdown"
units = ["skill/pr-breakdown"]
extras = ["templates/pr-breakdown-map.html"]

[[packages]]
name = "pr-ops"
units = [
  "skill/pr-babysit",
  "skill/pr-explain",
  "skill/pr-make",
  "skill/pr-make-till-merge",
  "skill/latest-rebase",
  "skill/shipped",
]

# pr-explain publishes a per-PR explainer page; its page skeleton ships as a package
# extra so an install is self-contained. The skill degrades to inline styling when
# installed without it (e.g. via pr-ops alone). The Vale prose-gate config ships alongside
# the page skeleton; both degrade gracefully when absent.
[[packages]]
name = "pr-explain"
units = ["skill/pr-explain"]
extras = ["templates/pr-explain-page.html", "templates/pr-explain.vale.ini"]

# dispatch fans a plan's ready PRs out into parallel tmux windows; the mechanics live in
# a small click-based helper package, shipped as this package's extra so an install is
# self-contained. Its own package (not pr-ops) so the extra stages with the one skill
# that reads it.
[[packages]]
name = "dispatch"
units = ["skill/dispatch"]
extras = ["scripts/dispatch"]

# --- bundles (provisional) ---
[[bundles]]
name = "tdd-pr-flow"
packages = ["architect-pr", "lite-pr"]

[[bundles]]
name = "planning"
packages = ["breakdown", "pr-breakdown"]
